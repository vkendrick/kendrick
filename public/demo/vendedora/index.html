<script>
const log = document.getElementById("log");
const status = document.getElementById("status");
const micBtn = document.getElementById("micBtn");
const txt = document.getElementById("txt");
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

let step = "idle"; // idle | open | day | hour | done

let booking = {};

let llmOn = true;
let llmFail = 0;

const SECURE = location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1";
let micDead = false;
function micOK() { return !!SR && SECURE && !micDead; }

function addMsg(text, who) {
  const d = document.createElement("div");
  d.className = "msg " + who;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;

function setStatus(on, label) {

}
function pickVoice() {
  const vs = speechSynthesis.getVoices();
  const es = vs.filter(v => v.lang.toLowerCase().startsWith("es"));
  const FEM = /helena|laura|monica|paulina|carmen|lucia|elena|alba|abril|elvira|irene|paloma|dalila|sofia|valentina|maria|ana|rosa|femenina|female|mujer/i;
  const MALE = /pablo|diego|jorge|carlos|miguel|enrique|pedro|juan|david|sergio|raul|andres|fernando|alvaro|adrian|tomas|hombre|male|masculino/i;
  return es.find(v => FEM.test(v.name)) || es.find(v => !MALE.test(v.name)) || es[0] || null;
}

  setStatus(true, "hablando...");

function norm(s) {
  return (s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}
const DIAS = { lunes: "el lunes", martes: "el martes", miercoles: "el miércoles", jueves: "el jueves", viernes: "el viernes", sabado: "el sábado", domingo: "el domingo", hoy: "hoy", manana: "mañana" };
const HORAS_TXT = { una: "1", dos: "2", tres: "3", cuatro: "4", cinco: "5", seis: "6", siete: "7", ocho: "8", nueve: "9", diez: "10", once: "11", doce: "12" };
function parseDay(t) {
  for (const k of Object.keys(DIAS)) if (t.indexOf(k) !== -1) return DIAS[k];
  if (/(fines de semana|fin de semana|finde)/.test(t)) return "el sábado";
  return null;
}
function parseHour(t) {
  let s = t;
  for (const w of Object.keys(HORAS_TXT)) s = s.replace(new RegExp("\\b" + w + "\\b"), HORAS_TXT[w]);
  if (/(por la mañana|manana)/.test(s)) return "10";
  if (/(por la tarde|\btarde\b)/.test(s)) return "16";
  if (/mediodia/.test(s)) return "12";
  const m = s.match(/(\d{1,2})(?::(\d{2}))?/);
  if (!m) return null;
  const h = parseInt(m[1], 10);
  if (h < 1 || h > 23) return null;
  if (!/(las|hora|horas|\bh\b|am|pm|y media)/.test(s) && (h < 8 || h > 20)) return null;
  return m[2] ? h + ":" + m[2] : String(h);
}
function showBookingCard(day, hour) {

const ACKS = ["¡Qué bueno! ", "Entiendo... ", "Mira, ", "Pues... "];
let lastAck = -1;
function ack() {
  let i;
  do { i = Math.floor(Math.random() * ACKS.length); } while (i === lastAck);
  lastAck = i;
  return ACKS[i];
}
function parseName(raw) {
  const s = norm(raw).replace(/(me llamo|mi nombre es|soy|me puedes llamar)\s*/g, "").trim().split(/\s+/).slice(0, 2).join(" ");
  return s ? s.charAt(0).toUpperCase() + s.slice(1) : "ti";
}

    const d = parseDay(t);

    booking.day = d; step = "hour";
    return "Genial, " + d + ". ¿A qué hora? De 10 a 19.";

  if (step === "hour") {

  }
  // menú numérico: 1 precio · 2 cómo funciona · 3 agendar
  if (/\b(uno|primera?|1)\b/.test(t)) { stage = "negocio"; return R.precio; }

  if (/\b(tres|tercera?|3)\b/.test(t)) { step = "day"; return "Genial. ¿Qué día te llamamos? Solo 15 minutos."; }

  if (/(chatgpt|gpt|gemini|ya uso ia|claude)/.test(t)) return "ChatGPT responde de todo y a veces inventa; esta solo sabe lo tuyo, deriva lo dudoso a ti y agenda. ¿Ves la diferencia? Te la enseño en una llamada.";

async function handleUser(text) {

    addMsg(reply, "ia");
    history.push({ role: "assistant", text: reply });
    if ("speechSynthesis" in window) speak(reply, () => { if (step !== "done") startListen(); });
    return;
  }
  const typing = document.createElement("div");
  typing.className = "msg ia typing";
  typing.innerHTML = "<span></span><span></span><span></span>";
  log.appendChild(typing); log.scrollTop = log.scrollHeight;
  let reply = null;
  if (llmOn) {
    try {
      const ctrl = new AbortController();
      const to = setTimeout(() => ctrl.abort(), 15000);
      const r = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history.slice(-12), stage }),
        signal: ctrl.signal,
      });
      clearTimeout(to);
      if (r.ok) {
        const j = await r.json();
        if (j && j.reply) {
          reply = j.reply;
          if (j.stage) stage = j.stage;
          history.push({ role: "assistant", text: reply });
          if (j.booked) showBookingCard(j.booked.day, j.booked.hour);
          if (j.ended) { step = "done"; listening = false; micBtn.disabled = true; micBtn.textContent = "Conversación terminada"; }
          llmFail = 0;
        } else { llmFail++; }
      } else { llmFail++; diagStatus = r.status; }
    } catch (e) { llmFail++; diagStatus = "red"; }
    if (llmFail >= 2) llmOn = false;
    if (!diagShown) {
      diagShown = true;
      if (diagStatus === 503) addMsg("Aviso: IA no configurada en el servidor (falta la clave). Hablo en modo local.", "sys");
      else if (diagStatus) addMsg("Aviso: IA indisponible (" + diagStatus + "). Hablo en modo local.", "sys");
    }
  }
  if (!reply) {
    reply = thinkLocal(text);
    history.push({ role: "assistant", text: reply });
  }
  typing.textContent = reply;
  typing.classList.remove("typing");
  log.scrollTop = log.scrollHeight;
  if ("speechSynthesis" in window) speak(reply, () => { if (step !== "done") startListen(); });
}
function startListen() {
  if (!micOK() || listening || step === "done") return;
  try {
    rec = new SR();
    rec.lang = "es-ES";
    rec.interimResults = false;
    rec.onstart = () => { listening = true; micBtn.classList.add("live"); micBtn.textContent = "🎙 Escuchando... pulsa para terminar"; setStatus(true, "en línea — te escucho"); };
    rec.onresult = (e) => { const t = e.results[0][0].transcript; stopListen(); handleUser(t); };
    rec.onerror = (e) => {
      stopListen();
      const err = (e && e.error) || "";
      if (err === "not-allowed" || err === "service-not-allowed") {
        micDead = true;
        micBtn.textContent = "💬 Seguir por texto";
        addMsg("Micro bloqueado 🔒 — permite el micrófono (candado junto a la URL) o sigue escribiendo abajo 👇", "sys");
      } else if (err === "no-speech") {
        addMsg("No te he oído — habla un poco más alto o escribe abajo 👇", "sys");
      } else if (err === "audio-capture") {
        micDead = true;
        micBtn.textContent = "💬 Seguir por texto";
        addMsg("No encuentro micrófono en este dispositivo — escribe abajo 👇", "sys");
      } else {
        addMsg("Me he quedado sin oído un momento — escribe abajo 👇", "sys");
      }
    };
    rec.onend = () => {
      listening = false; micBtn.classList.remove("live");
      if (micDead) { micBtn.textContent = "💬 Seguir por texto"; }
      else if (step !== "done" && step !== "idle") micBtn.textContent = "🎙 Seguir hablando";
    };
    rec.start();
  } catch (e) { addMsg("Tu navegador no permite el micro — escribe abajo 👇", "sys"); }
}
function stopListen() { try { rec && rec.stop(); } catch (e) {} listening = false; micBtn.classList.remove("live"); }
const hangBtn = document.getElementById("hangBtn");
function hangUp(silent) {
  stopListen(); step = "done"; listening = false;
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  micBtn.disabled = true; micBtn.textContent = "Llamada terminada";
  hangBtn.style.display = "none";
  if (!silent) addMsg("Llamada terminada. Gracias por probar la demo.", "sys");
}
hangBtn.onclick = () => hangUp(false);
micBtn.onclick = () => {
  if (step === "idle") {
    if (!micOK()) {
      if (!SR) addMsg("Este navegador no tiene reconocimiento de voz (abre el link en Chrome). Puedes escribir abajo 👇 y Vera te responde hablando.", "sys");
      else if (!SECURE) addMsg("Abre el link https (no el archivo) para usar el micro. Mientras tanto, escribe abajo 👇.", "sys");
      else addMsg("Micro no disponible — escribe abajo 👇 y Vera te responde hablando.", "sys");
    }
    step = "open";
    hangBtn.style.display = "";
    const hi = "Hola, soy Vera, la vendedora virtual de Kendrick. Sí, soy una inteligencia artificial... como la que podría estar atendiendo tu negocio ahora mismo, las 24 horas. ¿Te gustaría tener una así? Te lo explico en un minuto.";
    addMsg(hi, "ia");
    if ("speechSynthesis" in window) speak(hi, startListen); else startListen();
    return;
  }
  if (step === "done") return;
  if (listening) {
    stopListen();
    micBtn.textContent = "🎙 Hablar";
    setStatus(true, "en línea");
  } else if (micOK()) {
    startListen();
  } else {
    addMsg("Micro no disponible ahora — escribe abajo 👇", "sys");
  }
};
document.getElementById("send").onclick = () => { const v = txt.value; txt.value = ""; if (step === "idle") { micBtn.onclick(); } handleUser(v); };
txt.addEventListener("keydown", (e) => { if (e.key === "Enter") document.getElementById("send").click(); });
if ("speechSynthesis" in window) { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices(); }
if (!micOK()) {
  micBtn.textContent = "💬 Empezar por texto";
  document.querySelector(".hint").textContent = !SR
    ? "Este navegador no soporta micro — abre en Chrome. Escribe y Vera responde hablando."
    : "Sem acesso ao micro — escreve abaixo e Vera responde falando.";
}
addMsg("Demo 100% gratuita. Pulsa «Escuchar» y actúa como dueño: pregunta precio, desconfía, di tu sector o «me interesa».", "sys");
</script>
