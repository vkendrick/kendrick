    <!-- Structured Data: LocalBusiness (para Google y IAs) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "Kendrick Consultoria Digital",
      "description": "Consultoría de marketing digital para pequeños negocios. Servicios de presencia online, SEO local, CRM y publicidad en redes sociales.",
      "url": "https://kendrickconsultoria.com",
      "email": "veridiana@kendrick.com",
      "telephone": "+34658598442",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "ES"
      },
      "areaServed": {
        "@type": "Country",
        "name": "España"
      },
      "serviceType": [
        "Consultoría de marketing digital",
        "Posicionamiento en Google",
        "Gestión de redes sociales",
        "Publicidad en Facebook e Instagram",
        "Diseño web para pequeños negocios",
        "SEO local"
      ],
      "priceRange": "€€",
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.9",
        "reviewCount": "47"
      },
      "sameAs": [
        "https://instagram.com/kendrickconsultoria",
        "https://linkedin.com/company/kendrickconsultoria"
      ]
    }
    </script>

    <!-- Structured Data: FAQPage (para Google Featured Snippets e IAs) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "¿Cuánto cuesta el servicio de consultoría digital?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Nuestros servicios van desde €450 para el Arranque Digital Mínimo (4 semanas) hasta €2.000 para la Mentoría de Crecimiento Avanzado (8 semanas). Cada nivel incluye todo lo del anterior."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cuándo empiezo a ver resultados?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Con el Nivel 01, en 2-3 semanas ya apareces en Google. Los primeros clientes desde internet suelen llegar entre la semana 3 y 6."
          }
        },
        {
          "@type": "Question",
          "name": "¿Necesito saber de tecnología para contratar sus servicios?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Nos encargamos de todo lo técnico. Al final te entregamos todo funcionando y te explicamos cómo usarlo en palabras simples."
          }
        },
        {
          "@type": "Question",
          "name": "¿Los paquetes son acumulativos?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sí. Cada nivel incluye todo lo del anterior. Si empiezas con el Nivel 01 y quieres crecer, el Nivel 02 parte de lo que ya tienes construido."
          }
        }
      ]
    }
    </script>
